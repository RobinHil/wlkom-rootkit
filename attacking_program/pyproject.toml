[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wlkom-attacking-program"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "rich==15.0.0",
    "argon2-cffi>=23.1.0",
]

[project.scripts]
rootkit = "attacking_program.main:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["attacking_program*"]

